name: PHP checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-offline-tests:
    name: PHP ${{ matrix.php }} — syntax and offline tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_mysql, sodium, curl, json
          coverage: none

      - name: Validate composer metadata
        run: composer validate --no-check-publish

      - name: Syntax check
        run: find src public bin tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Ensure Hostinger routing points to tested release
        run: |
          grep -Fq 'RewriteRule ^ilm-admin/?$ public/admin_20261111_r3.php [L,QSA]' .htaccess
          grep -Fq 'admin_20261111_r3\.php' .htaccess
          if grep -Fq 'RewriteRule ^ilm-admin/?$ public/admin_20261111_b2.php' .htaccess; then
            echo "FAIL: old admin release is still routable"
            exit 1
          fi

      - name: Smoke-test both admin entrypoints without database
        shell: bash
        run: |
          set -euo pipefail
          for entrypoint in public/admin.php public/admin_20261111_r3.php; do
            output="$(GATEWAY_HOST=gateway.iluma.gr php -d display_errors=1 -r '
              $_SERVER["HTTP_HOST"]="gateway.iluma.gr";
              $_SERVER["REQUEST_URI"]="/ilm-admin";
              $_SERVER["REQUEST_METHOD"]="GET";
              require $argv[1];
            ' -- "$entrypoint" 2>&1)"
            grep -Fq 'Σύνδεση διαχειριστή' <<< "$output"
            if grep -Eq 'Fatal error|Internal server error|Warning:|Parse error' <<< "$output"; then
              echo "FAIL: admin GET login smoke test: $entrypoint"
              exit 1
            fi
          done

      - name: Exercise Hostinger deployment-integrity preflight
        run: bash bin/check-hostinger-deploy.sh

      - name: Test missing CSRF rejection
        run: php tests/admin_security.php

      - name: Run isolated security and payment state tests
        run: php tests/run.php
