name: PHP checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-offline-tests:
    name: PHP ${{ matrix.php }} — syntax and offline tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_mysql, sodium, curl, json
          coverage: none

      - name: Validate composer metadata
        run: composer validate --no-check-publish

      - name: Syntax check
        run: find src public bin tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Enforce one canonical PHP admin entrypoint
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'RewriteRule ^ilm-admin/?$ public/admin.php [L,QSA]' .htaccess
          grep -Fq 'admin\.php' .htaccess
          if find public -maxdepth 1 -type f -name 'admin_*.php' | grep -q . ||
             find src -maxdepth 1 -type f -name 'AdminEntry_*.php' | grep -q .; then
            echo 'FAIL: duplicate release-numbered PHP admin files'
            exit 1
          fi

      - name: Smoke-test canonical admin without database
        shell: bash
        run: |
          set -euo pipefail
          for request in '/ilm-admin/' '/ilm-admin/?p=payments'; do
            output="$(GATEWAY_HOST=gateway.iluma.gr php -d display_errors=1 -r '
              $_SERVER["HTTP_HOST"]="gateway.iluma.gr";
              $_SERVER["REQUEST_URI"]=$argv[1];
              $_SERVER["REQUEST_METHOD"]="GET";
              require "public/admin.php";
            ' -- "$request" 2>&1)"
            if ! grep -Fq 'Σύνδεση διαχειριστή' <<< "$output" ||
               grep -Eq 'Fatal error|Internal server error|Warning:|Parse error' <<< "$output"; then
              echo "FAIL: canonical admin smoke test $request"
              exit 1
            fi
          done

      - name: Exercise Hostinger deployment-integrity preflight
        run: bash bin/check-hostinger-deploy.sh

      - name: Test missing CSRF rejection
        run: php tests/admin_security.php

      - name: Run isolated security and payment state tests
        run: php tests/run.php
