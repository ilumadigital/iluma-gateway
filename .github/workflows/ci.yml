name: PHP checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-offline-tests:
    name: PHP ${{ matrix.php }} — syntax and offline tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_mysql, sodium, curl, json
          coverage: none

      - name: Validate composer metadata
        run: composer validate --no-check-publish

      - name: Syntax check
        run: find src public bin tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run isolated security and payment state tests
        run: php tests/run.php

      - name: Verify staging-only advertising checkout safeguards
        run: php tests/advertising_budget.php
