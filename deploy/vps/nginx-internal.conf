# Internal-only HTTP endpoint. Host Nginx terminates TLS and enforces HTTPS.
# No source PHP files are served as static files.
server {
    listen 8080;
    server_name gateway.iluma.gr;
    server_tokens off;
    client_max_body_size 64k;
    root /usr/share/nginx/html;
    index index.invalid;

    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;

    location = /ilm-admin/admin.css {
        try_files /admin.css =404;
        types { text/css css; }
    }
    location = /ilm-admin/admin.js {
        try_files /admin.js =404;
        types { application/javascript js; }
    }

    location = /ilm-admin { include /etc/nginx/fastcgi_params; fastcgi_param SCRIPT_FILENAME /srv/iluma-gateway/app/public/admin.php; fastcgi_param HTTPS on; fastcgi_pass php:9000; }
    location = /ilm-admin/ { include /etc/nginx/fastcgi_params; fastcgi_param SCRIPT_FILENAME /srv/iluma-gateway/app/public/admin.php; fastcgi_param HTTPS on; fastcgi_pass php:9000; }

    # Allow only routes explicitly implemented by the Gateway router.
    location ~ ^/api/v1/[A-Za-z0-9_./:-]+$ {
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/iluma-gateway/app/public/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass php:9000;
    }
    location ~ ^/nexi/(staging|production)/notification$ {
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/iluma-gateway/app/public/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass php:9000;
    }
    location = /checkout/result { include /etc/nginx/fastcgi_params; fastcgi_param SCRIPT_FILENAME /srv/iluma-gateway/app/public/index.php; fastcgi_param HTTPS on; fastcgi_pass php:9000; }
    location = /checkout/cancel { include /etc/nginx/fastcgi_params; fastcgi_param SCRIPT_FILENAME /srv/iluma-gateway/app/public/index.php; fastcgi_param HTTPS on; fastcgi_pass php:9000; }

    location / { return 404; }
}
